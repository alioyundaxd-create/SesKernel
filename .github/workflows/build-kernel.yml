name: Build Galaxy M51 Custom Kernel (SM7150)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: 'KernelSU Sürümü'
        required: true
        default: 'KernelSU-Next (Legacy/4.14)'
        type: choice
        options:
          - 'KernelSU-Next (Legacy/4.14)'
          - 'Official KernelSU (v0.9.5 - Legacy)'
          - 'None'
      enable_wireguard:
        description: 'WireGuard Entegrasyonu'
        required: true
        default: true
        type: boolean
      enable_boeffla:
        description: 'Boeffla Wakelock Blocker'
        required: true
        default: true
        type: boolean
      enable_zram_zstd:
        description: 'zRAM ZSTD Sıkıştırma'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Depoyu Çalışma Alanına Çek (Checkout)
        uses: actions/checkout@v4

      - name: Derleme Bağımlılıklarını Kur
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev git zip unzip make curl \
            libncurses5-dev libncurses-dev libelf-dev clang lld llvm ccache \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            libxml2-utils xsltproc gnupg ca-certificates python3

      - name: Proton Clang Araç Zincirini İndir
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          echo "Proton Clang (Android Linux 4.14 için optimize edilmiş hepsi bir arada araç zinciri) indiriliyor..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git proton-clang
          
          # aarch64-linux-android- uyumluluk köprüsü oluştur (vendor sürücülerinin hata vermemesi için)
          mkdir -p $GITHUB_WORKSPACE/compat-bin
          for tool in gcc ld as ar nm objcopy objdump strip; do
            if [ -f "$GITHUB_WORKSPACE/toolchain/proton-clang/bin/aarch64-linux-gnu-$tool" ]; then
              ln -sf "$GITHUB_WORKSPACE/toolchain/proton-clang/bin/aarch64-linux-gnu-$tool" "$GITHUB_WORKSPACE/compat-bin/aarch64-linux-android-$tool"
            else
              ln -sf "/usr/bin/aarch64-linux-gnu-$tool" "$GITHUB_WORKSPACE/compat-bin/aarch64-linux-android-$tool"
            fi
          done

      - name: M51 SM7150 Çekirdek Kaynağını Klonla
        run: |
          cd $GITHUB_WORKSPACE
          echo "Galaxy M51 SM7150 kernel kaynağı klonlanıyor..."
          git clone --depth=1 https://github.com/yuichigojo/kernel_m51.git -b 14 kernel

      - name: KernelSU Entegre Et (Linux 4.14 Non-GKI Uyumlu)
        if: ${{ github.event_name == 'push' || inputs.ksu_variant != 'None' }}
        run: |
          cd $GITHUB_WORKSPACE/kernel
          KSU_CHOICE="${{ inputs.ksu_variant }}"
          [ -z "$KSU_CHOICE" ] && KSU_CHOICE="KernelSU-Next (Legacy/4.14)"
          
          if [ "$KSU_CHOICE" = "KernelSU-Next (Legacy/4.14)" ]; then
            echo "KernelSU-Next (Linux 4.14 non-GKI optimize 'legacy' dalı) entegre ediliyor..."
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy
          elif [ "$KSU_CHOICE" = "Official KernelSU (v0.9.5 - Legacy)" ]; then
            echo "Official KernelSU (v0.9.5 Legacy) entegre ediliyor..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" | bash -s v0.9.5
          fi
          
          # Out-of-tree (O=out) derlemede symlink kopmalarını önlemek için gerçek kaynakları kopyala
          if [ -L "$GITHUB_WORKSPACE/kernel/drivers/kernelsu" ]; then
            REAL_KSU_PATH=$(readlink -f "$GITHUB_WORKSPACE/kernel/drivers/kernelsu")
            rm -f "$GITHUB_WORKSPACE/kernel/drivers/kernelsu"
            cp -r "$REAL_KSU_PATH" "$GITHUB_WORKSPACE/kernel/drivers/kernelsu"
          fi
          
          # Defconfig ayarlarını temiz ve garantili şekilde aktifleştir
          bash scripts/config --file arch/arm64/configs/m51_defconfig \
            -e KSU \
            -e KPROBES \
            -e HAVE_KPROBES \
            -e KPROBE_EVENTS \
            -e OVERLAY_FS
          
          echo "CONFIG_KSU=y" >> arch/arm64/configs/m51_defconfig
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/m51_defconfig
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/m51_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/m51_defconfig
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/m51_defconfig

      - name: WireGuard Sürücüsünü Entegre Et
        if: ${{ github.event_name == 'push' || inputs.enable_wireguard }}
        run: |
          echo "WireGuard çekirdek sürücüsü ekleniyor..."
          git clone --depth=1 https://github.com/WireGuard/wireguard-linux-compat.git /tmp/wireguard
          
          # jury-rig.sh ile çekirdek Makefile ve Kconfig bağlantısını yap
          bash /tmp/wireguard/kernel-tree-scripts/jury-rig.sh "$GITHUB_WORKSPACE/kernel"
          
          # Out-of-tree derlemede symlink kopmalarını önlemek için gerçek kaynak dosyalarını aktar
          rm -rf "$GITHUB_WORKSPACE/kernel/net/wireguard"
          cp -r /tmp/wireguard/src "$GITHUB_WORKSPACE/kernel/net/wireguard"
          if [ -f "$GITHUB_WORKSPACE/kernel/net/wireguard/Kbuild" ]; then
            cp -n "$GITHUB_WORKSPACE/kernel/net/wireguard/Kbuild" "$GITHUB_WORKSPACE/kernel/net/wireguard/Makefile" || true
          fi
          
          bash scripts/config --file arch/arm64/configs/m51_defconfig -e WIREGUARD
          echo "CONFIG_WIREGUARD=y" >> "$GITHUB_WORKSPACE/kernel/arch/arm64/configs/m51_defconfig"
          echo "==> WireGuard entegrasyonu tamamlandı."

      - name: Boeffla Wakelock Blocker Entegre Et
        if: ${{ github.event_name == 'push' || inputs.enable_boeffla }}
        run: |
          echo "Boeffla Wakelock Blocker uygulanıyor..."
          bash $GITHUB_WORKSPACE/patches/apply_boeffla.sh "$GITHUB_WORKSPACE/kernel"

      - name: zRAM ZSTD Yapılandırmasını Uygula
        if: ${{ github.event_name == 'push' || inputs.enable_zram_zstd }}
        run: |
          echo "zRAM ZSTD sıkıştırma bayrakları ayarlanıyor..."
          cd $GITHUB_WORKSPACE/kernel
          bash scripts/config --file arch/arm64/configs/m51_defconfig \
            -e CRYPTO_ZSTD \
            -e ZSTD_COMPRESS \
            -e ZSTD_DECOMPRESS \
            -e ZRAM_DEF_COMP_ZSTD \
            -e ZRAM_WRITEBACK
          
          echo "CONFIG_CRYPTO_ZSTD=y" >> arch/arm64/configs/m51_defconfig
          echo "CONFIG_ZSTD_COMPRESS=y" >> arch/arm64/configs/m51_defconfig
          echo "CONFIG_ZSTD_DECOMPRESS=y" >> arch/arm64/configs/m51_defconfig
          echo "CONFIG_ZRAM_DEF_COMP_ZSTD=y" >> arch/arm64/configs/m51_defconfig
          echo "CONFIG_ZRAM_WRITEBACK=y" >> arch/arm64/configs/m51_defconfig

      - name: Çekirdeği Derle (Compile Kernel)
        run: |
          cd $GITHUB_WORKSPACE/kernel
          
          export PATH=$GITHUB_WORKSPACE/compat-bin:$GITHUB_WORKSPACE/toolchain/proton-clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_USER="SesKernel"
          export KBUILD_BUILD_HOST="GitHubActions"
          
          echo "Yapılandırma dosyası hazırlanıyor: m51_defconfig"
          make O=out m51_defconfig
          
          echo "Derleme başlatılıyor..."
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb dtbo.img || make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb || make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz

      - name: AnyKernel3 Paketini Hazırla
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          
          # Özelleştirilmiş anykernel.sh dosyasını kopyala
          cp -f $GITHUB_WORKSPACE/anykernel3/anykernel.sh AnyKernel3/anykernel.sh
          
          # Çıkan imaj dosyalarını AnyKernel3 içine aktar
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
            echo "Image.gz-dtb kopyalandı."
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
            echo "Image.gz kopyalandı."
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            gzip -c9 kernel/out/arch/arm64/boot/Image > AnyKernel3/Image.gz
            echo "Image sıkıştırılıp Image.gz olarak kopyalandı."
          fi
          
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
            echo "dtbo.img kopyalandı."
          fi
          
          # Sıkıştır ve flashlanabilir zip üret
          DATE=$(date +"%Y%m%d-%H%M")
          ZIP_NAME="SesKernel-M51-SM7150-${DATE}.zip"
          cd AnyKernel3
          zip -r9 ../$ZIP_NAME * -x .git README.md *placeholder
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Flashlanabilir Kernel Zip Dosyasını Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
